name: Weekly content

on:
  schedule:
    # Mondays ~08:23 UTC. Off-the-hour minute on purpose: cron jobs at minute 0
    # hit GitHub's busiest queue and get delayed by hours; an odd minute runs far
    # more punctually. (Was '0 8 * * 1' — fired but consistently ~9h late.)
    - cron: '23 8 * * 1'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci || npm install

      - name: Generate next article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/gen-article.js

      - name: Inject into HTML
        run: node scripts/inject-articles.js
        env:
          SITE_BASE: ${{ vars.SITE_BASE || 'https://loafandlevain.com' }}

      - name: Commit and push
        run: |
          git config user.name "Content Bot"
          git config user.email "bot@users.noreply.github.com"
          git add articles sourdough-schedule.html sitemap.xml
          git diff --staged --quiet || git commit -m "auto: weekly article + injection"
          git push
