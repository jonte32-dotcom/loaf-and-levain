name: Pinterest auto-post

on:
  schedule:
    # Posts a pin every other day at 14:00 UTC (good engagement window)
    - cron: '0 14 */2 * *'
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci || npm install

      - name: Generate pin images (if not yet generated)
        run: |
          if [ ! -d dist-pins ] || [ -z "$(ls -A dist-pins 2>/dev/null)" ]; then
            node scripts/gen-pinterest-pins.js
          fi

      - name: Post next pin to Pinterest
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          SITE_BASE: ${{ vars.SITE_BASE || 'https://loafandlevain.com' }}
        run: |
          if [ -z "$PINTEREST_TOKEN" ] || [ -z "$PINTEREST_BOARD_ID" ]; then
            echo "Pinterest credentials not configured yet — skipping (Trial access still pending)."
            exit 0
          fi
          node scripts/post-pinterest-pin.js

      - name: Commit state
        run: |
          # Only commit if a pin was actually posted (state file created). When
          # credentials are absent the post step skips and writes nothing, so a
          # bare `git add` here would fail with exit 128 and redden the whole run.
          if [ -f pinterest-state.json ]; then
            git config user.name "Pinterest Bot"
            git config user.email "bot@users.noreply.github.com"
            git add pinterest-state.json
            git diff --staged --quiet || { git commit -m "auto: pinterest pin posted"; git pull --rebase origin main; git push; }
          else
            echo "No pinterest-state.json — nothing posted, skipping commit."
          fi
